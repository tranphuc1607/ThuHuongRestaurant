name: Deploy ThuHuong Restaurant

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build tất cả services với Maven
      run: cd back-end && mvn clean package -DskipTests

    - uses: docker/setup-buildx-action@v3

    - name: Login GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build discovery-server
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/discovery-server
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-discovery-server:latest

    - name: Build config-server
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/config-server
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-config-server:latest

    - name: Build api-gateway
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/api-gateway
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-api-gateway:latest

    - name: Build auth-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/auth-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-auth-service:latest

    - name: Build user-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/user-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-user-service:latest

    - name: Build product-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/product-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-product-service:latest

    - name: Build inventory-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/inventory-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-inventory-service:latest

    - name: Build order-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/order-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-order-service:latest

    - name: Build payment-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/payment-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-payment-service:latest

    - name: Build hr-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/hr-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-hr-service:latest

    - name: Build dashboard-service
      uses: docker/build-push-action@v5
      with:
        context: ./back-end/service/dashboard-service
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-dashboard-service:latest

    - name: Build frontend
      uses: docker/build-push-action@v5
      with:
        context: ./front-end
        push: true
        tags: ghcr.io/tranphuc1607/thuhuong-frontend:latest

    - name: Copy docker-compose lên VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "back-end/docker-compose.prod.yml"
        target: "/home/thuhuong/app"

    - name: Deploy lên VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/thuhuong/app/back-end
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          echo "Deploy thành công!"
