server.port=8088
spring.application.name=hr-service

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HR Bot config (dien sau khi tao bot tren BotFather)
hr.telegram.bot.token=${HR_TELEGRAM_BOT_TOKEN:}
hr.telegram.bot.username=${HR_TELEGRAM_BOT_USERNAME:}

# Telegram IDs cua Admin (ngan cach phay, VD: 123456789,987654321)
hr.telegram.admin-ids=${HR_TELEGRAM_ADMIN_IDS:}

# WiFi verification (ngan duong check IP khi check-in)
# Dat thanh IP prefix cua mang noi bo (VD: 192.168.1) hoac IP public cua router
# Dat thanh * de tat check (chi dung khi test)
hr.wifi.allowed-ip=${HR_WIFI_ALLOWED_IP:14.232.39.99}
hr.server.public-url=${HR_SERVER_PUBLIC_URL:http://14.232.39.99:8080}
hr.telegram.checkin-secret=${HR_CHECKIN_SECRET:change-me-in-production-use-long-random-string}

logging.level.com.example.hrservice=INFO
