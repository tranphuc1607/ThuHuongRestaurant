server.port=8086
spring.application.name=order-service

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Thong tin thanh toan VietQR
app.payment.bank-id=TPB
app.payment.account-number=0357527135
app.payment.account-holder=TRAN MINH PHUC
app.payment.bank-name=TPBank

# Booking Admin Bot — tach rieng khoi payment bot, chi admin thay
booking.telegram.bot.token=${BOOKING_TELEGRAM_BOT_TOKEN:}
booking.telegram.bot.username=${BOOKING_TELEGRAM_BOT_USERNAME:}
booking.telegram.admin-ids=${BOOKING_TELEGRAM_ADMIN_IDS:}

# Quet hoa don (AI vision) — Gemini la provider chinh
# Model de trong config vi Google doi model/quota free khong bao truoc
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# Ngan sach token "suy nghi": de mac dinh thi model doi ~3200 token suy nghi cho 110 token tra loi,
# cham gap nhieu lan ma khong chinh xac hon voi bai toan trich xuat theo schema co dinh.
# 0 bi API tu choi (400), -1 = tra ve mac dinh cua Google.
gemini.thinking-budget=${GEMINI_THINKING_BUDGET:128}

# OpenRouter — giu lai lam duong lui neu Gemini het quota
openrouter.api.key=${OPENROUTER_API_KEY:}

# Feign timeout — giới hạn DB connection bị giữ khi gọi external service
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=8000

# Feign circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j — inventory-service
resilience4j.circuitbreaker.instances.inventory-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.inventory-service.permitted-number-of-calls-in-half-open-state=3

# Resilience4j — product-service
resilience4j.circuitbreaker.instances.product-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.product-service.permitted-number-of-calls-in-half-open-state=3
