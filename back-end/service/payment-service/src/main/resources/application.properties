server.port=8087
spring.application.name=payment-service

# Thong tin thanh toan VietQR (chinh lai theo tai khoan quan)
app.payment.bank-id=TPB
app.payment.account-number=0357527135
app.payment.account-holder=TRAN MINH PHUC
app.payment.bank-name=TPBank

# Sepay webhook — gia tri thuc lay tu env var trong docker-compose.yml
sepay.webhook.apikey=${SEPAY_WEBHOOK_APIKEY:not-set}
# IP duoc phep goi webhook: "*" = tat check (dev), danh sach IP ngan cach phay (production)
sepay.webhook.allowed-ips=${SEPAY_WEBHOOK_ALLOWED_IPS:*}



# Feign timeout — giới hạn thời gian chờ gọi order-service
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=8000

# Feign circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=true

# Resilience4j — order-service
resilience4j.circuitbreaker.instances.order-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.order-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.order-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.order-service.permitted-number-of-calls-in-half-open-state=3
