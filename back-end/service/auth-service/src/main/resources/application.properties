server.port:8082
# Đặt lại INFO để tránh lộ JWT/credentials trong log
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# JWT expiry — 30 ngay (override config server neu can)
app.security.jwt.expiration=2592000
app.jwt.refresh-token-validity-in-seconds=2592000