services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - microservice-network

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservice-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-thuhuong_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  discovery-server:
    image: ghcr.io/tranphuc1607/thuhuong-discovery-server:latest
    container_name: discovery-server
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - microservice-network

  config-server:
    image: ghcr.io/tranphuc1607/thuhuong-config-server:latest
    container_name: config-server
    mem_limit: 400m
    depends_on:
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/tranphuc1607/microservice-config-repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - microservice-network
    restart: always

  auth-service:
    image: ghcr.io/tranphuc1607/thuhuong-auth-service:latest
    container_name: auth-service
    mem_limit: 400m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - microservice-network

  user-service:
    image: ghcr.io/tranphuc1607/thuhuong-user-service:latest
    container_name: user-service
    mem_limit: 400m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=user_user
      - SPRING_DATASOURCE_PASSWORD=user_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - microservice-network

  product-service:
    image: ghcr.io/tranphuc1607/thuhuong-product-service:latest
    container_name: product-service
    mem_limit: 400m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/product_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=product_user
      - SPRING_DATASOURCE_PASSWORD=product_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - microservice-network

  inventory-service:
    image: ghcr.io/tranphuc1607/thuhuong-inventory-service:latest
    container_name: inventory-service
    mem_limit: 400m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inventory_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=inventory_user
      - SPRING_DATASOURCE_PASSWORD=inventory_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - microservice-network

  order-service:
    image: ghcr.io/tranphuc1607/thuhuong-order-service:latest
    container_name: order-service
    mem_limit: 450m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - BOOKING_TELEGRAM_BOT_TOKEN=${BOOKING_TELEGRAM_BOT_TOKEN}
      - BOOKING_TELEGRAM_BOT_USERNAME=${BOOKING_TELEGRAM_BOT_USERNAME}
      - BOOKING_TELEGRAM_ADMIN_IDS=${BOOKING_TELEGRAM_ADMIN_IDS}
    networks:
      - microservice-network

  payment-service:
    image: ghcr.io/tranphuc1607/thuhuong-payment-service:latest
    container_name: payment-service
    mem_limit: 400m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=payment_user
      - SPRING_DATASOURCE_PASSWORD=payment_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SEPAY_WEBHOOK_APIKEY=${SEPAY_WEBHOOK_APIKEY}
      - SEPAY_WEBHOOK_ALLOWED_IPS=*
    networks:
      - microservice-network

  hr-service:
    image: ghcr.io/tranphuc1607/thuhuong-hr-service:latest
    container_name: hr-service
    mem_limit: 450m
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hr_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=hr_user
      - SPRING_DATASOURCE_PASSWORD=hr_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - HR_TELEGRAM_BOT_TOKEN=${HR_TELEGRAM_BOT_TOKEN}
      - HR_TELEGRAM_BOT_USERNAME=${HR_TELEGRAM_BOT_USERNAME}
      - HR_TELEGRAM_ADMIN_IDS=${HR_TELEGRAM_ADMIN_IDS}
      - HR_CHECKIN_SECRET=${HR_CHECKIN_SECRET}
      - HR_WIFI_ALLOWED_IP=${HR_WIFI_ALLOWED_IP}
      - HR_SERVER_PUBLIC_URL=${HR_SERVER_PUBLIC_URL}
    networks:
      - microservice-network

  dashboard-service:
    image: ghcr.io/tranphuc1607/thuhuong-dashboard-service:latest
    container_name: dashboard-service
    mem_limit: 400m
    restart: on-failure
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    networks:
      - microservice-network

  api-gateway:
    image: ghcr.io/tranphuc1607/thuhuong-api-gateway:latest
    container_name: api-gateway
    mem_limit: 400m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
    networks:
      - microservice-network

  frontend:
    image: ghcr.io/tranphuc1607/thuhuong-frontend:latest
    container_name: frontend
    mem_limit: 300m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://103.82.22.19/api/v1
      - BACKEND_API_URL=http://api-gateway:8080/api/v1
      - NEXT_PUBLIC_APP_URL=http://103.82.22.19
      - IMGBB_API_KEY=${IMGBB_API_KEY}
    depends_on:
      - api-gateway
    networks:
      - microservice-network
    restart: on-failure

networks:
  microservice-network:
    driver: bridge

volumes:
  mysql_data:
