services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Port KHÔNG expose ra host — chỉ internal services mới cần
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - microservice-network

  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "auth_db" # Tạo sẵn một db mặc định nếu cần
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservice-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      # Default phải khớp default của SPRING_RABBITMQ_USERNAME ở các service, nếu không
      # thì clone về mà chưa có .env sẽ tạo broker user khác với user client dùng để đăng nhập.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-thuhuong_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    # 5672 và 15672 không expose ra host — chỉ internal services cần
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    # Port 8761 chỉ expose khi debug — production nên bỏ dòng này
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/eureka/apps"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - microservice-network

  config-server:
    build: ./config-server
    container_name: config-server
    # Port 8888 chỉ bind localhost — busrefresh dùng: curl http://localhost:8888/actuator/busrefresh
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/tranphuc1607/microservice-config-repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - microservice-network
    restart: always

  product-service:
    build: ./service/product-service
    container_name: product-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/product_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=product_user
      - SPRING_DATASOURCE_PASSWORD=product_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    networks:
      - microservice-network

  inventory-service:
    build: ./service/inventory-service
    container_name: inventory-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/inventory_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=inventory_user
      - SPRING_DATASOURCE_PASSWORD=inventory_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    networks:
      - microservice-network

  user-service:
    build: ./service/user-service
    container_name: user-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/user_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=user_user
      - SPRING_DATASOURCE_PASSWORD=user_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    networks:
      - microservice-network

  auth-service:
    build: ./service/auth-service
    container_name: auth-service
    ports:
      - "8082:8082" # Sửa lại mapping port cho đúng (Local:Container)
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    networks:
      - microservice-network

  order-service:
    build: ./service/order-service
    container_name: order-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
      - BOOKING_TELEGRAM_BOT_TOKEN=${BOOKING_TELEGRAM_BOT_TOKEN}
      - BOOKING_TELEGRAM_BOT_USERNAME=${BOOKING_TELEGRAM_BOT_USERNAME}
      - BOOKING_TELEGRAM_ADMIN_IDS=${BOOKING_TELEGRAM_ADMIN_IDS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_THINKING_BUDGET=${GEMINI_THINKING_BUDGET:-128}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - microservice-network

  payment-service:
    build: ./service/payment-service
    container_name: payment-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/payment_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=payment_user
      - SPRING_DATASOURCE_PASSWORD=payment_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
      - SEPAY_WEBHOOK_APIKEY=${SEPAY_WEBHOOK_APIKEY}
      # Production: thay * bang IP that cua Sepay (103.57.220.220,103.57.220.221)
      - SEPAY_WEBHOOK_ALLOWED_IPS=*
    networks:
      - microservice-network

  hr-service:
    build: ./service/hr-service
    container_name: hr-service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/hr_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=hr_user
      - SPRING_DATASOURCE_PASSWORD=hr_pass_2024
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
      # Điền sau khi tạo bot trên BotFather:
      - HR_TELEGRAM_BOT_TOKEN=${HR_TELEGRAM_BOT_TOKEN}
      - HR_TELEGRAM_BOT_USERNAME=${HR_TELEGRAM_BOT_USERNAME}
      - HR_TELEGRAM_ADMIN_IDS=${HR_TELEGRAM_ADMIN_IDS}
      - HR_CHECKIN_SECRET=${HR_CHECKIN_SECRET}
      - HR_WIFI_ALLOWED_IP=${HR_WIFI_ALLOWED_IP}
      - HR_SERVER_PUBLIC_URL=${HR_SERVER_PUBLIC_URL}
    networks:
      - microservice-network

  dashboard-service:
    build: ./service/dashboard-service
    container_name: dashboard-service
    restart: on-failure
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    networks:
      - microservice-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:8888
      # Gateway có spring-cloud-starter-bus-amqp nên vẫn kết nối RabbitMQ dù không nhận message
      # nghiệp vụ nào; thiếu 3 dòng này nó rơi về guest/guest và retry ACCESS_REFUSED vô hạn.
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-thuhuong_mq}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_secure_2024}
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge

volumes:
  mysql_data: